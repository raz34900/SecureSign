# Public entrypoint over TLS. Plain HTTP redirects rather than serving.
server {
    listen 80;
    return 301 https://$host:8443$request_uri;
}

server {
    listen 443 ssl;
    http2 on;

    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    # Short max-age on purpose: this host also serves the internal panel over plain
    # HTTP on 8081, and a long-lived HSTS pin would make it unreachable once a
    # developer trusts the self-signed certificate. Raise it with a real certificate.
    add_header Strict-Transport-Security "max-age=300" always;

    # The engineering panel and account provisioning are internal tooling. 404 rather
    # than 403, because the public web has no business learning they exist. Longest-prefix
    # match wins, so these take precedence over /api/ and the SPA fallback below.
    location /engineering { return 404; }
    location /api/engineering { return 404; }
    location /accounts { return 404; }
    location /api/admin { return 404; }

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # An empty value makes nginx drop the header entirely, so a client cannot
        # smuggle the internal marker in from outside.
        proxy_set_header X-Internal-Panel "";
    }

    include /etc/nginx/securesign-static.inc;
}

# Internal entrypoint, loopback-published, plain HTTP by design.
server {
    listen 8081;

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Internal-Panel "1";
    }

    include /etc/nginx/securesign-static.inc;
}
