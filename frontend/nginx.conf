# Per-address limit on sign-in. This is the only component that sees the real client
# address - the API is handed every request by this container - so an address-based
# limit can only live here. It complements the per-account limit in the application:
# this one stops one source trying many accounts, that one stops many sources grinding
# down one account. On Docker Desktop for Mac every external client presents as the VM
# gateway, so expect this to behave as a single bucket in local testing.
limit_req_zone $binary_remote_addr zone=signin:10m rate=20r/m;

# A log path holding variables is only written after nginx confirms the request's root
# directory exists; proxied locations have none, so without this their lines vanish.
root /usr/share/nginx/html;

# daily-logging
map $time_iso8601 $logdate {
    "~^(?<ymd>\d{4}-\d{2}-\d{2})" $ymd;
    default 'date-unknown';
}

# Public entrypoint over TLS. Plain HTTP redirects rather than serving.
#
# Split in two because the redirect reflects the client's Host, and a reflected Host in
# a Location is an open redirect the moment a cache or middlebox sits in front: ask for
# it with `Host: evil.test` and nginx answers https://evil.test:8443/. Only names this
# deployment actually answers on get a redirect; anything else gets the connection
# closed. The regex covers bare IPv4, so reaching it over the LAN still works.
#
# This file is an envsubst template (see the Dockerfile): ${PUBLIC_TLS_PORT} and
# ${PUBLIC_SERVER_NAME} are substituted at container start, defaults baked into the
# image. Deployment sets PUBLIC_TLS_PORT=443 and its domain in .env; nothing here
# changes. nginx's own $variables are untouched - envsubst only replaces names that
# exist in the environment.
server {
    listen 80 default_server;
    return 444;
}

server {
    listen 80;
    # No braces in these regexes on purpose: nginx reads an unquoted { } as a block
    # delimiter and refuses to start. Digits-and-dots is enough to mean "a bare IP".
    server_name localhost ~^[0-9.]+$ ~^.+\.local$ ${PUBLIC_SERVER_NAME};
    return 301 https://$host:${PUBLIC_TLS_PORT}$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    access_log /var/log/nginx/access-$logdate.log main;
    access_log /dev/stdout main;

    include /etc/nginx/securesign-tls.inc;
    include /etc/nginx/securesign-headers.inc;

    # The engineering panel and account provisioning are internal tooling. 404 rather
    # than 403, because the public web has no business learning they exist. Longest-prefix
    # match wins, so these take precedence over /api/ and the SPA fallback below.
    location /engineering { return 404; }
    location /api/engineering { return 404; }
    location /accounts { return 404; }
    location /api/admin { return 404; }

    # The generated schema names every route, including the four above, which makes
    # hiding them pointless. It stays available on the internal listener.
    location /api/openapi.json { return 404; }
    location /api/docs { return 404; }
    location /api/redoc { return 404; }

    # Exact match, so it wins over the /api/ prefix below and nothing else is throttled.
    location = /api/auth/login {
        limit_req zone=signin burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    include /etc/nginx/securesign-static.inc;
}

# Internal entrypoint, loopback-published, and encrypted like everything else. Loopback
# traffic does not leave the host, but the panel that provisions accounts is the last
# place to make an exception, and an exception here is what forced the short HSTS above.
server {
    listen 8081 ssl;
    http2 on;
    access_log /var/log/nginx/access-$logdate.log main;
    access_log /dev/stdout main;

    include /etc/nginx/securesign-tls.inc;

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    include /etc/nginx/securesign-static.inc;
}
