# Public entrypoint: everything the outside world may reach.
server {
    listen 80;

    # The engineering panel and account provisioning are internal tooling. 404 rather
    # than 403, because the public web has no business learning they exist. Longest-prefix
    # match wins, so these take precedence over /api/ and the SPA fallback below.
    location /engineering { return 404; }
    location /api/engineering { return 404; }
    location /accounts { return 404; }
    location /api/admin { return 404; }

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    include /etc/nginx/securesign-static.inc;
}

# Internal entrypoint: published on the host loopback only (see deploy/docker-compose.yml),
# so it answers the machine running the stack and nothing else.
server {
    listen 8081;

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    include /etc/nginx/securesign-static.inc;
}
