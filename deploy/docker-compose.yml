services:
  frontend:
    build:
      context: ../frontend
    ports:
      - "8080:80"
    depends_on:
      - api

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    expose:
      - "8000"
    ports:
      - "8000:8000"   # direct API access for dev/tests; remove for prod
    env_file:
      - ../.env
    volumes:
      - ../data:/srv/securesign/data

