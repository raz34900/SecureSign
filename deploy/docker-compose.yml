services:
  frontend:
    build:
      context: ../frontend
    ports:
      - "8080:80"
      # Engineering panel. Bound to the host loopback, so it is unreachable from the
      # network no matter what the firewall says.
      - "127.0.0.1:8081:8081"
    volumes:
      - ./tls:/etc/nginx/tls:ro
    depends_on:
      - api

  # Same image, TLS configuration mounted over the default. The profile gates this
  # service on; it does not gate the plain frontend off, and both claim 8080/8081.
  # Start it with: docker compose --profile tls up -d frontend-tls api
  frontend-tls:
    profiles: ["tls"]
    build:
      context: ../frontend
    ports:
      - "8443:443"
      - "8080:80"
      - "127.0.0.1:8081:8081"
    volumes:
      - ./tls:/etc/nginx/tls:ro
      - ../frontend/nginx-tls.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    expose:
      - "8000"
    ports:
      - "127.0.0.1:8000:8000"   # direct API access for dev/tests; remove for prod
    env_file:
      - ../.env
    volumes:
      - ../data:/srv/securesign/data

