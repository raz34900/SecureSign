# Paths and retention only. Everything deployment-specific - the cipher passphrase today,
# the S3/Backblaze repository at deployment - arrives as PGBACKREST_* environment
# variables from compose, so pointing backups at another target is a .env change and
# never an image rebuild.
#
# At deployment, switching to Backblaze B2 means setting (alongside the cipher pass):
#   PGBACKREST_REPO1_TYPE=s3
#   PGBACKREST_REPO1_S3_ENDPOINT=s3.eu-central-003.backblazeb2.com
#   PGBACKREST_REPO1_S3_BUCKET=...   PGBACKREST_REPO1_S3_REGION=eu-central-003
#   PGBACKREST_REPO1_S3_KEY=...      PGBACKREST_REPO1_S3_KEY_SECRET=...
#   PGBACKREST_REPO1_PATH=/securesign

[main]
pg1-path=/var/lib/postgresql/data
# The cluster's superuser is securesign (POSTGRES_USER), not postgres; pgbackrest's
# default is to connect as the OS user's name, which has no role here.
pg1-user=securesign

[global]
repo1-path=/var/lib/pgbackrest
# Two full backups kept; expiring the older one also expires the WAL that only it needs.
repo1-retention-full=2
# The backup begins with an immediate checkpoint instead of waiting for a scheduled one.
start-fast=y
log-level-console=info
log-level-file=off
